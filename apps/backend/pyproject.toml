[project]
name = "lookbuddy-backend"
version = "0.1.0"
description = "LookBuddy API and agent layer"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  "tzdata>=2026.1"
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "httpx>=0.28,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookbuddy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

